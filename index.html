<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuda Risma Wahyudi</title>
    <link rel="icon" type="image/png" href="assets/logo/logo.png">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1KC31K9FHV"></script>
    <script>
        // Only track on production (github.io), not localhost
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-1KC31K9FHV');
        } 
    </script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand" id="nav-brand"></div>
            <ul class="nav-menu">
                <li><a href="#about" class="nav-link">About</a></li>
                <li><a href="#experience" class="nav-link">Experience</a></li>
                <li><a href="#projects" class="nav-link">Projects</a></li>
                <li><a href="#skills" class="nav-link">Skills</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="container">
            <h1 class="hero-name" id="hero-name"></h1>
            <h2 class="hero-title" id="hero-title"></h2>
            <p class="hero-tagline" id="hero-tagline"></p>
            <div class="social-links" id="social-links"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- About Section -->
            <section id="about" class="content-section">
                <h2 class="section-heading">About</h2>
                <div class="about-text" id="about-text"></div>
            </section>

            <!-- Experience Section -->
            <section id="experience" class="content-section">
                <h2 class="section-heading">Experience</h2>
                <div class="experience-list" id="experience-list"></div>
                <a href="assets/resume/Resume - Yuda Risma Wahyudi - 2025.pdf" class="view-full-resume" id="view-resume-link" target="_blank" rel="noopener">Download Full Resume <i class="fas fa-arrow-right"></i></a>
            </section>

            <!-- Projects Section -->
            <section id="projects" class="content-section">
                <h2 class="section-heading">Projects</h2>
                <div class="projects-list" id="projects-list"></div>
                <!-- <a href="#" class="view-archive" id="view-archive-link">View Full Project Archive <i class="fas fa-arrow-right"></i></a> -->
            </section>

            <!-- Research & Publication Section -->
            <section id="research" class="content-section">
                <h2 class="section-heading">Research & Publication</h2>
                <div class="publications-list" id="publications-list"></div>
            </section>

            <!-- Skills Section -->
            <section id="skills" class="content-section">
                <h2 class="section-heading">Skills & Technologies</h2>
                <div class="skills-grid" id="skills-grid"></div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>Designed & Built by <span id="footer-name"></span></p>
            <p class="footer-tech" id="footer-text"></p>
        </div>
    </footer>

    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="assets/js/content.js"></script>
    <script src="assets/js/app.js"></script>
    
    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        ↑
    </button>
    
    <script>
        // Back to Top Button
        const backToTopBtn = document.getElementById('backToTop');
        
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });
        
        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
    <script>
        // If navigated with #projects, scroll the projects section into view
        window.addEventListener('load', () => {
            if (window.location.hash === '#projects') {
                const projectsSection = document.getElementById('projects');
                if (projectsSection) {
                    projectsSection.scrollIntoView({ behavior: 'smooth' });
                }
            }
        });
    </script>
</body>
</html>
